name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches metadata.json
        run: |
          version=$(python3 -c "import json; print(json.load(open('metadata.json'))['version-name'])")
          test "$GITHUB_REF_NAME" = "v$version" \
            || { echo "Tag $GITHUB_REF_NAME does not match version-name $version"; exit 1; }
      - name: Build the zip
        run: make pack
      - name: Publish the GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
