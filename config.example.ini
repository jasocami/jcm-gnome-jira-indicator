# Jira Indicator settings. Full explanation of every key: MANUAL.md (or "Help" in the menu).
# Your copy lives in ~/.config/jcm-gnome-jira-indicator/config.ini. Changes apply on the next refresh.

[jira]
# Your Atlassian site, without https://
domain = your-company.atlassian.net
# The email you log in to Jira with
email = your.name@example.com
# Your Jira API token, from https://id.atlassian.com/manage-profile/security/api-tokens
# It works like a password: keep this file private and never commit or share it.
token =
# Which issues to show. Anything valid in Jira's advanced search works here.
jql = (assignee = currentUser() OR comment ~ currentUser() OR description ~ currentUser())
      AND statusCategory != Done ORDER BY updated DESC
# Safety cap on how many issues to load
max_results = 100

[indicator]
# Text shown in the top bar before the counter: "Jira" gives "Jira 28 (2)"
title = Jira
# How often to refresh, in minutes (minimum 1)
refresh_minutes = 5
# Longest summary shown in the menu before it is cut with …
summary_max_chars = 60
# What "Help" opens: online (the manual of your installed version on GitHub) or local (the copy installed with it)
help = online
